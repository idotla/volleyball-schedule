<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排球協會國內賽事查詢</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f7f7f5; --card:#ffffff; --ink:#1c1c1c; --muted:#6b6b6b;
    --accent:#c0392b; --accent-soft:#fdecea; --border:#e5e2dc;
    --warn-bg:#fff7e0; --warn-border:#e8c766;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15151a; --card:#1f1f26; --ink:#eceae6; --muted:#9a9a9a;
      --accent:#e0776b; --accent-soft:#3a2321; --border:#33333c;
      --warn-bg:#332a10; --warn-border:#8a6d1f;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    padding-block:32px;
  }
  .wrap{max-width:820px;margin:0 auto;padding-inline:20px;}
  header h1{font-size:1.5rem;margin:0 0 4px;}
  header .sub{color:var(--muted);font-size:0.9rem;margin-bottom:24px;}

  .search-box{margin-bottom:28px;}
  .search-box input{
    width:100%;padding:14px 16px;font-size:1.05rem;border:1px solid var(--border);
    border-radius:12px;background:var(--card);color:var(--ink);
  }
  .search-box input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search-hint{color:var(--muted);font-size:0.82rem;margin-top:6px;}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:18px 20px;margin-bottom:14px;
  }
  .card h2{margin:0 0 8px;font-size:1.05rem;}
  .badge{
    display:inline-block;background:var(--accent-soft);color:var(--accent);
    font-size:0.75rem;padding:2px 9px;border-radius:999px;font-weight:600;margin-bottom:8px;
  }
  .meta-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:0.88rem;}
  .meta-grid dt{color:var(--muted);white-space:nowrap;}
  .meta-grid dd{margin:0;}

  .match-day-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    overflow:hidden;margin-bottom:12px;
  }
  .match-row{padding:14px 20px;border-bottom:1px solid var(--border);}
  .match-row:last-child{border-bottom:none;}
  .match-row-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .match-time{color:var(--accent);font-weight:700;font-size:0.95rem;white-space:nowrap;}
  .match-teams{font-size:1.05rem;font-weight:700;}
  .match-teams .vs{color:var(--muted);font-weight:400;margin:0 6px;}
  .match-teams .hit{color:var(--accent);}
  .match-row-meta{
    display:flex;flex-wrap:wrap;gap:14px;font-size:0.85rem;color:var(--muted);margin-top:6px;
  }
  .match-row-meta span{white-space:nowrap;}
  .group-tag{
    display:inline-block;font-size:0.72rem;padding:1px 8px;border-radius:6px;
    background:var(--accent-soft);color:var(--accent);
  }

  .notice{
    background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:10px;
    padding:10px 12px;font-size:0.82rem;line-height:1.6;margin-top:8px;
  }
  .empty, .error{color:var(--muted);font-size:0.9rem;text-align:center;padding:40px 0;}
  .section-title{font-size:0.85rem;color:var(--muted);margin:24px 0 10px;font-weight:600;}
  footer{color:var(--muted);font-size:0.8rem;text-align:center;margin-top:30px;line-height:1.6;}

  .status-badge{
    display:inline-block;font-size:0.75rem;padding:2px 9px;border-radius:999px;
    font-weight:600;margin-bottom:8px;margin-right:6px;
    background:var(--accent-soft);color:var(--accent);
  }
  .coming-soon-list{
    background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  }
  .coming-soon-row{
    padding:12px 20px;border-bottom:1px solid var(--border);
  }
  .coming-soon-row:last-child{border-bottom:none;}
  .coming-soon-name{font-size:0.92rem;margin-bottom:6px;}

  .tournament-heading{
    font-size:1.15rem;font-weight:700;margin:28px 0 12px;padding-bottom:8px;
    border-bottom:2px solid var(--accent);
  }
  .tournament-heading:first-of-type{margin-top:6px;}
  .gender-heading{
    font-size:0.82rem;font-weight:700;color:var(--accent);margin:16px 0 8px;
  }
  .date-heading{
    font-size:0.8rem;font-weight:600;color:var(--muted);margin:12px 0 6px 4px;
  }
  .tournament-meta{
    display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;
    font-size:0.85rem;color:var(--muted);margin-bottom:10px;
  }
  .attachments{margin:4px 0 16px;}
  .attachments-title{font-size:0.8rem;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .attachments-list{display:flex;flex-wrap:wrap;gap:8px;}
  .attachment-link{
    font-size:0.82rem;color:var(--accent);background:var(--accent-soft);
    padding:4px 10px;border-radius:8px;text-decoration:none;
  }
  .attachment-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏐 排球協會國內賽事查詢</h1>
    <div class="sub">資料來源：中華民國排球協會官網，每日自動更新</div>
  </header>

  <div class="search-box">
    <input type="text" id="search" value="大雅國中" placeholder="輸入學校或隊伍名稱，查詢該隊的比賽賽程...">
    <div class="search-hint">預設顯示大雅國中的賽程，如要查詢其他學校/隊伍，直接在上面欄位輸入即可</div>
  </div>

  <div id="results"></div>

  <footer>
    資料來源：<a href="https://www.ctvba.org.tw/article/front/inGame" target="_blank" rel="noopener">中華民國排球協會官網</a>
  </footer>
</div>

<script>
function el(tag, opts = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(opts)) {
    if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  children.forEach(c => e.appendChild(c));
  return e;
}

function highlight(name, q) {
  if (!q) return el('span', {text: name});
  const i = name.toLowerCase().indexOf(q);
  if (i === -1) return el('span', {text: name});
  const before = name.slice(0, i), hit = name.slice(i, i + q.length), after = name.slice(i + q.length);
  const span = el('span');
  span.appendChild(document.createTextNode(before));
  span.appendChild(el('span', {class: 'hit', text: hit}));
  span.appendChild(document.createTextNode(after));
  return span;
}

function titleOf(ev) {
  // 2026-09-10 使用者要求盃賽標題統一格式(年度第幾屆+盃賽名稱+日期區間)，
  // 不要協會公告原始標題那些「全國」「競賽規程」「(8/28更新...)」之類的
  // 贅字。scraper端(merge_events_by_tournament)已經產生格式化好的
  // display_title欄位，這裡只是fallback：萬一某筆資料是舊格式快取、還沒有
  // 這個欄位，就退回顯示原始的name，總比顯示空白好。
  return ev.display_title || ev.name || '(未命名賽事)';
}

function genderOf(m) {
  // 從 group 欄位判斷這場是男排還是女排，例如「國男小組賽B」「高女 小組賽D」；
  // 有些組別(例如「社九」)不含男/女字樣(混合或不分性別的組別)，歸到「其他」。
  const g = m.group || '';
  if (g.includes('男')) return '男排';
  if (g.includes('女')) return '女排';
  return '其他';
}

function renderMatchRow(m, q) {
  // 2026-09-10 使用者要求：同一天的比賽擺在同一個方框裡面(見下方
  // renderMatchesGroupedByDate，一個日期分組對應一個 .match-day-card)，
  // 且比賽時間要擺在對戰隊伍「前面」。日期本身已經是分組標題了，這裡
  // (每一場比賽的row)就不重複顯示日期。
  const row = el('div', {class: 'match-row'});

  const main = el('div', {class: 'match-row-main'});
  if (m.time) main.appendChild(el('span', {class: 'match-time', text: '⏰ ' + m.time}));
  const teams = el('span', {class: 'match-teams'});
  teams.appendChild(highlight(m.team_a || '', q));
  teams.appendChild(el('span', {class: 'vs', text: 'vs'}));
  teams.appendChild(highlight(m.team_b || '', q));
  main.appendChild(teams);
  row.appendChild(main);

  const meta = el('div', {class: 'match-row-meta'});
  if (m.venue) meta.appendChild(el('span', {text: `📍 ${m.venue}`}));
  if (m.group) {
    meta.appendChild(el('span', {class: 'group-tag', text: m.group + (m.match_no ? ' ' + m.match_no : '')}));
  }
  if (meta.children.length) row.appendChild(meta);

  return row;
}

function formatDateHeading(dateStr) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  if (!m) return dateStr;
  const d = new Date(dateStr + 'T00:00:00');
  const week = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return `${parseInt(m[2], 10)}月${parseInt(m[3], 10)}日（星期${week}）`;
}

function groupMatchesByDate(matches) {
  // 依日期分組，抓不到日期的用「第X天」退而求其次，兩者都沒有的歸到
  // 「日期未定」；分組本身依日期先後排序(有精確日期的優先，同樣沒日期
  // 的再依day數字排序)。
  const groups = new Map();
  matches.forEach(m => {
    const key = m.date || (m.day ? `第${m.day}天` : '日期未定');
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  });
  return Array.from(groups.entries())
    .map(([key, list]) => ({key, list}))
    .sort((a, b) => {
      const da = a.list[0], db = b.list[0];
      if (da.date && db.date) return da.date < db.date ? -1 : da.date > db.date ? 1 : 0;
      if (da.date) return -1;
      if (db.date) return 1;
      return (da.day || 0) - (db.day || 0);
    });
}

function renderMatchesGroupedByDate(container, matches, ev, q) {
  groupMatchesByDate(matches).forEach(({key, list}) => {
    container.appendChild(el('div', {class: 'date-heading', text: formatDateHeading(key)}));
    const box = el('div', {class: 'match-day-card'});
    list.forEach(m => box.appendChild(renderMatchRow(m, q)));
    container.appendChild(box);
  });
}

function renderAttachmentsList(ev) {
  // 相關文件下載連結：2026-09-10 使用者要求簡化，一律直接連協會官網的原始
  // 連結(att.url)，不使用repo本地檔案(local_path)。
  // 同一天使用者再要求：附件只留「總賽程表」跟「(分組)賽制圖」這兩種，
  // 其他像競賽規程、個人/團體資料及肖像授權同意書之類的不需要顯示。
  const atts = (ev.attachments || []).filter(a => /賽程表|賽制圖/.test(a.name || ''));
  if (!atts.length) return null;
  const wrap = el('div', {class: 'attachments'});
  wrap.appendChild(el('div', {class: 'attachments-title', text: '📎 相關文件'}));
  const list = el('div', {class: 'attachments-list'});
  atts.forEach(a => {
    const href = a.url;
    if (!href) return;
    list.appendChild(el('a', {
      href, target: '_blank', rel: 'noopener', class: 'attachment-link', text: a.name || '附件',
    }));
  });
  if (!list.children.length) return null;
  wrap.appendChild(list);
  return wrap;
}

function parseEventRange(ev) {
  // 回傳 {start, end}（Date物件），抓不到日期就回傳 null
  if (!ev.date_start) return null;
  const start = new Date(ev.date_start + 'T00:00:00');
  const end = new Date((ev.date_end || ev.date_start) + 'T23:59:59');
  if (isNaN(start.getTime())) return null;
  return {start, end};
}

function eventDistanceMs(ev, now) {
  // 用來排序「離現在最近」：進行中=0，未開打=距開打的時間，已結束=距結束的時間，
  // 完全沒日期資料的排到最後面(Infinity)。
  const range = parseEventRange(ev);
  if (!range) return Infinity;
  if (now >= range.start && now <= range.end) return 0;
  if (now < range.start) return range.start - now;
  return now - range.end;
}

function statusLabel(ev, now) {
  const range = parseEventRange(ev);
  if (!range) return null;
  if (now >= range.start && now <= range.end) return '🔴 進行中';
  if (now < range.start) {
    const days = Math.ceil((range.start - now) / 86400000);
    return days <= 0 ? '即將開打' : `${days} 天後開打`;
  }
  const days = Math.floor((now - range.end) / 86400000);
  return days <= 0 ? '剛結束' : `${days} 天前結束`;
}

function renderEventOverviewCard(ev, opts = {}) {
  const card = el('div', {class: 'card'});
  const label = statusLabel(ev, opts.now || new Date());
  if (label) card.appendChild(el('span', {class: 'status-badge', text: label}));
  if (ev.organizer) card.appendChild(el('span', {class: 'badge', text: ev.organizer + ' 主辦'}));
  card.appendChild(el('h2', {text: titleOf(ev)}));

  const dl = el('dl', {class: 'meta-grid'});
  const rows = [
    ['比賽日期', ev.date_note || [ev.date_start, ev.date_end].filter(Boolean).join(' ~ ')],
    ['比賽地點', ev.venue],
  ];
  rows.forEach(([k, v]) => {
    if (!v) return;
    dl.appendChild(el('dt', {text: k}));
    dl.appendChild(el('dd', {text: v}));
  });
  if (dl.children.length) card.appendChild(dl);

  const attBlock = renderAttachmentsList(ev);
  if (attBlock) card.appendChild(attBlock);

  if (!ev.matches || !ev.matches.length) {
    const msg = (ev.parse_warnings && ev.parse_warnings.length)
      ? ev.parse_warnings.join('；')
      : '目前還沒有這個賽事的場次資料。';
    card.appendChild(el('div', {class: 'notice', text: 'ℹ️ ' + msg}));
  }

  return card;
}

function renderComingSoonRow(ev, now) {
  // 2026-09-10 使用者反饋：手機畫面上標題跟原始日期文字(ev.date_note)並排
  // 會把標題擠成窄欄、換行很難看；而且 titleOf(ev) 現在已經內建格式化好的
  // 日期區間了(見 titleOf/display_title)，原本這裡另外顯示 ev.date_note
  // 只是把同樣的日期資訊再講一次，純屬多餘。改成只顯示標題，另外附上跟
  // 「最近賽事」卡片同樣邏輯算出來的倒數狀態(「N天後開打」等)，這個資訊
  // 才是標題裡沒有的。appendComingSoon() 已經濾掉查不到日期的賽事，這裡
  // 的 statusLabel() 一定算得出來。
  const row = el('div', {class: 'coming-soon-row'});
  row.appendChild(el('div', {class: 'coming-soon-name', text: titleOf(ev)}));
  const label = statusLabel(ev, now);
  if (label) row.appendChild(el('span', {class: 'status-badge', text: label}));
  return row;
}

let ALL_EVENTS = [];

function renderResults(query) {
  const container = document.getElementById('results');
  container.innerHTML = '';
  const q = query.trim().toLowerCase();

  if (!q) {
    if (!ALL_EVENTS.length) {
      container.appendChild(el('div', {class: 'section-title', text: '目前追蹤的賽事'}));
      container.appendChild(el('div', {class: 'empty', text: '目前沒有賽事資料'}));
      return;
    }

    // 只把「離現在最近」的一筆賽事完整顯示出來(進行中優先，其次是最快開打的，
    // 都沒有的話退而求其次挑最近剛結束的)，其餘賽事簡化成一行列表，標成
    // Coming Soon，不用每筆都佔一大張卡片。
    const now = new Date();
    const ranked = ALL_EVENTS
      .map(ev => ({ev, dist: eventDistanceMs(ev, now)}))
      .sort((a, b) => a.dist - b.dist);
    const featured = ranked[0].ev;
    const rest = ranked.slice(1).map(r => r.ev);

    container.appendChild(el('div', {class: 'section-title', text: '最近賽事'}));
    container.appendChild(renderEventOverviewCard(featured, {now}));

    appendComingSoon(container, rest, now);
    return;
  }

  const hits = [];
  ALL_EVENTS.forEach(ev => {
    (ev.matches || []).forEach(m => {
      const a = (m.team_a || '').toLowerCase();
      const b = (m.team_b || '').toLowerCase();
      if (a.includes(q) || b.includes(q)) hits.push({m, ev});
    });
  });

  const now = new Date();

  if (!hits.length) {
    container.appendChild(el('div', {class: 'empty', text: `找不到「${query}」的比賽場次，可能是這個賽事的賽程還沒解析出來，或名稱寫法不同，可以換個關鍵字試試看。`}));
    appendComingSoon(container, ALL_EVENTS, now);
    return;
  }

  container.appendChild(el('div', {class: 'section-title', text: `最近賽事・找到 ${hits.length} 場比賽`}));

  // 先依賽事(盃賽)分組，同一個盃賽底下再依男排/女排分兩區塊顯示，
  // 賽事本身依「離現在最近」排序(用跟首頁一樣的邏輯)，讓最近的盃賽排最前面。
  const byEvent = new Map();
  hits.forEach(({m, ev}) => {
    const key = ev.name || '';
    if (!byEvent.has(key)) byEvent.set(key, {ev, matches: []});
    byEvent.get(key).matches.push(m);
  });
  const groupedEvents = Array.from(byEvent.values())
    .sort((a, b) => eventDistanceMs(a.ev, now) - eventDistanceMs(b.ev, now));

  const GENDER_ORDER = ['男排', '女排', '其他'];
  groupedEvents.forEach(({ev, matches}) => {
    container.appendChild(el('div', {class: 'tournament-heading', text: titleOf(ev)}));

    const metaLine = el('div', {class: 'tournament-meta'});
    const label = statusLabel(ev, now);
    if (label) metaLine.appendChild(el('span', {class: 'status-badge', text: label}));
    const dateText = ev.date_note || [ev.date_start, ev.date_end].filter(Boolean).join(' ~ ');
    if (dateText) metaLine.appendChild(el('span', {text: '📅 ' + dateText}));
    if (ev.venue) metaLine.appendChild(el('span', {text: '📍 ' + ev.venue}));
    if (metaLine.children.length) container.appendChild(metaLine);

    const attBlock = renderAttachmentsList(ev);
    if (attBlock) container.appendChild(attBlock);

    const byGender = {'男排': [], '女排': [], '其他': []};
    matches.forEach(m => byGender[genderOf(m)].push(m));
    GENDER_ORDER.forEach(label => {
      const list = byGender[label];
      if (!list.length) return;
      container.appendChild(el('div', {class: 'gender-heading', text: label}));
      renderMatchesGroupedByDate(container, list, ev, q);
    });
  });

  // 其餘沒有找到這個關鍵字比賽的賽事，簡化成「即將登場」清單放在最下面，
  // 讓使用者知道還有哪些盃賽在追蹤中。
  const shownNames = new Set(groupedEvents.map(g => g.ev.name || ''));
  const rest = ALL_EVENTS.filter(ev => !shownNames.has(ev.name || ''));
  appendComingSoon(container, rest, now);
}

function appendComingSoon(container, events, now) {
  // 「即將登場」只列真的查得到比賽日期的賽事(parseEventRange抓得到)，
  // 像和家盃、媽祖盃目前抓到的都是舊文章、根本沒有查到115學年的比賽日期，
  // 顯示「日期未定」反而容易讓人誤會協會已經公布、只是還沒排定——
  // 2026-09-10 使用者要求拿掉這種「查無日期」的，即將登場清單目前應該
  // 只會顯示華宗盃這種真的排出比賽日期的賽事。
  const withDate = events.filter(ev => parseEventRange(ev) !== null);
  if (!withDate.length) return;
  const ranked = withDate.slice().sort((a, b) => eventDistanceMs(a, now) - eventDistanceMs(b, now));
  container.appendChild(el('div', {class: 'section-title', text: '即將登場・Coming Soon'}));
  const list = el('div', {class: 'coming-soon-list'});
  ranked.forEach(ev => list.appendChild(renderComingSoonRow(ev, now)));
  container.appendChild(list);
}

document.getElementById('search').addEventListener('input', (e) => renderResults(e.target.value));

fetch('data/events.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    ALL_EVENTS = data;
    renderResults(document.getElementById('search').value);
  })
  .catch(err => {
    document.getElementById('results').innerHTML = '';
    document.getElementById('results').appendChild(
      el('div', {class: 'error', text: '資料載入失敗：' + err.message + '（可能是排程還沒跑過第一次）'})
    );
  });
</script>
</body>
</html>
