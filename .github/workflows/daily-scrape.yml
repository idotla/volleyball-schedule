name: 每日抓取排球協會賽事資料

on:
  schedule:
    # UTC 11:10 = 台灣時間(UTC+8) 平日晚上7點10分。故意不用整點(19:00)，避開 GitHub Actions
    # 排程在整點常常會塞車延遲的問題。day-of-week 用 1-5 代表週一到週五(0/7=週日)，
    # 協會網站平常不會在週末發新公告，週六日不排程。
    - cron: "10 11 * * 1-5"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動點一下馬上跑一次

permissions:
  contents: write   # 需要能把抓到的資料 commit 回 repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行爬蟲
        run: python scraper/scrape_ctvba.py --out docs/data/events.json

      - name: 檢查資料檔是否有變化
        id: git-check
        run: |
          git config user.name "ctvba-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/events.json docs/data/last_updated.json docs/data/scrape_cache.json docs/data/attachments
          git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit 並推送更新
        if: steps.git-check.outputs.changed == 'true'
        run: |
          # 附件PDF加起來可能有幾十MB，一次push偶爾會遇到 GitHub 那邊的
          # RPC逾時(HTTP 408)，加大git的HTTP緩衝區、改用HTTP/1.1、並失敗時
          # 重試幾次，避免單純網路不穩就讓整個排程失敗。
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          git commit -m "每日自動更新賽事資料 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功(第 $i 次嘗試)"
              exit 0
            fi
            echo "推送失敗，5秒後重試(第 $i 次嘗試)..."
            sleep 5
          done
          echo "推送重試 5 次都失敗"
          exit 1
