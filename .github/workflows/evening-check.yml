name: 平日晚間檢查排球協會官網更新（有更新才寄信通知）

on:
  schedule:
    # UTC 11:00 = 台灣時間(UTC+8) 平日晚上7點。day-of-week 用 1-5 代表週一到週五(0/7=週日)，
    # 週六日不排程。
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動點一下馬上跑一次(測試用)

permissions:
  contents: write

jobs:
  evening-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行爬蟲
        run: python scraper/scrape_ctvba.py --out docs/data/events.json

      - name: 設定 git 使用者
        run: |
          git config user.name "ctvba-scraper-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: 檢查「比賽資料」本身是否有變化(不含更新時間戳記，用來決定要不要寄信)
        id: data-check
        run: |
          git add docs/data/events.json docs/data/scrape_cache.json docs/data/attachments
          git diff --cached --quiet && echo "data_changed=false" >> "$GITHUB_OUTPUT" || echo "data_changed=true" >> "$GITHUB_OUTPUT"

      - name: 加入更新時間戳記(這個檔案每次跑都會變，所以獨立於上面的資料變化判斷之外)
        run: git add docs/data/last_updated.json

      - name: 檢查是否有任何東西要commit
        id: git-check
        run: |
          git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit 並推送更新
        if: steps.git-check.outputs.changed == 'true'
        run: |
          # 附件PDF加起來可能有幾十MB，一次push偶爾會遇到 GitHub 那邊的
          # RPC逾時(HTTP 408)，加大git的HTTP緩衝區、改用HTTP/1.1、並失敗時
          # 重試幾次，避免單純網路不穩就讓整個排程失敗。
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          git commit -m "平日晚間檢查 $(date -u +%Y-%m-%d)（比賽資料有變化：${{ steps.data-check.outputs.data_changed }}）"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功(第 $i 次嘗試)"
              exit 0
            fi
            echo "推送失敗，5秒後重試(第 $i 次嘗試)..."
            sleep 5
          done
          echo "推送重試 5 次都失敗"
          exit 1

      - name: 寄信通知有新資料(只有真的偵測到比賽資料變化才寄，時間戳記變化不算)
        if: steps.data-check.outputs.data_changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "【排球賽程查詢】排球協會官網賽事資料有更新"
          to: idotla@gmail.com
          from: 排球賽程查詢機器人 <${{ secrets.GMAIL_ADDRESS }}>
          body: |
            平日晚間檢查(台灣時間19:00)偵測到中華民國排球協會官網的賽事資料有更新（永信盃/媽祖盃/華宗盃/和家盃其中至少一項）。

            請至網站查看最新賽程：https://idotla.github.io/volleyball-schedule/

            (這封信由 GitHub Actions 自動寄出，偵測到資料沒有變化時不會寄信。)
